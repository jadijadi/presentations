<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Computer Used to Obey You — Slides</title>
<style>
  :root{
    --bg:#0b0c0f;
    --fg:#f2f0e8;
    --dim:#8a8d95;
    --accent:#e8c14a;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Monaco,
            "Cascadia Mono", "JetBrains Mono", "IBM Plex Mono",
            "Roboto Mono", Consolas, "Liberation Mono", monospace;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg); color:var(--fg);
    font-family: var(--mono);
    overflow:hidden;
  }
  #deck{
    position:relative;
    width:100vw; height:100vh;
  }
  .slide{
    position:absolute; inset:0;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding: 6vh 8vw;
  }
  .slide.active{ display:flex; }

  .kicker{
    font-family: var(--mono);
    text-transform:uppercase;
    letter-spacing:0.25em;
    font-size: clamp(0.7rem, 1.2vw, 1rem);
    color: var(--accent);
    margin-bottom: 2.2vh;
  }
  .main{
    font-size: clamp(1.4rem, 3.5vw, 3.1rem);
    line-height:1.4;
    font-weight:normal;
    letter-spacing:-0.02em;
    max-width: 68rem;
  }
  .main.quote::before{ content:"“"; }
  .main.quote::after{ content:"”"; }
  .sub{
    margin-top: 3vh;
    font-family: var(--mono);
    font-size: clamp(0.78rem, 1.15vw, 1.02rem);
    line-height:1.65;
    color: var(--dim);
    max-width: 50rem;
  }
  .attrib{
    margin-top: 2vh;
    font-family: var(--mono);
    font-style: normal;
    font-size: clamp(0.8rem, 1.1vw, 1.05rem);
    color: var(--dim);
    letter-spacing:0.03em;
  }
  .title .main{ font-size: clamp(1.7rem, 4.4vw, 4rem); font-weight:bold; }
  /* terminal cursor on the title slides */
  .title .main::after{
    content:"\2588";
    color: var(--accent);
    margin-left:0.1em;
    animation: blink 1.1s step-end infinite;
  }
  @keyframes blink{ 50%{ opacity:0; } }
  @media (prefers-reduced-motion: reduce){
    .title .main::after{ animation:none; }
  }
  .big-word{
    font-family: var(--mono);
    font-weight:bold;
    font-size: clamp(3rem, 12vw, 10rem);
    color: var(--fg);
  }

  /* progress bar */
  #progress{
    position:fixed; left:0; bottom:0; height:3px;
    background:var(--accent);
    width:0%;
    transition: width 0.2s ease;
  }
  #counter{
    position:fixed; right:1.2rem; bottom:1rem;
    font-family: var(--mono);
    font-size:0.8rem;
    color: var(--dim);
  }
  #hint{
    position:fixed; left:1.2rem; bottom:1rem;
    font-family: var(--mono);
    font-size:0.75rem;
    color: var(--dim);
    opacity:0.6;
  }
  .vidlink{
    margin-top: 2.4vh;
    font-family: var(--mono);
    font-size: clamp(0.75rem, 1vw, 0.95rem);
  }
  .vidlink a{
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px solid rgba(232,193,74,0.4);
  }
  .vidlink a:hover{ border-bottom-color: var(--accent); }
  .quote-photo{
    width: clamp(6rem, 12vw, 9rem);
    height: clamp(6rem, 12vw, 9rem);
    border-radius: 50%;
    object-fit: cover;
    object-position: top center;
    margin-bottom: 2vh;
    border: 2px solid var(--accent);
  }
  .shot{
    max-width: min(86vw, 72rem);
    max-height: 54vh;
    width:auto; height:auto;
    margin-top: 3vh;
    border-radius: 6px;
    border: 1px solid rgba(232,193,74,0.35);
    box-shadow: 0 1.2rem 3rem rgba(0,0,0,0.65);
  }
  .slide.shot-slide{ padding: 4vh 5vw; }
  .slide.shot-slide .main{ font-size: clamp(1.05rem, 2.3vw, 1.9rem); }
  .slide.shot-slide .sub{ margin-top: 2.4vh; max-width: 56rem; }
  .act-tag{
    position:fixed; top:1rem; left:1.2rem;
    font-family: var(--mono);
    font-size:0.7rem;
    letter-spacing:0.15em;
    text-transform:uppercase;
    color: var(--dim);
    opacity:0.7;
  }
</style>
</head>
<body>

<div id="deck"></div>
<div id="progress"></div>
<div id="counter"></div>
<div id="hint">← → space · f fullscreen</div>
<div class="act-tag" id="acttag"></div>

let i = 0;
const deck = document.getElementById('deck');
const progress = document.getElementById('progress');
const counter = document.getElementById('counter');
const acttag = document.getElementById('acttag');

function render(){
  deck.innerHTML = '';
  const s = slides[i];
  const el = document.createElement('div');
  el.className = 'slide active' + (s.title ? ' title' : '') + (s.image ? ' shot-slide' : '');
  el.innerHTML = `
    ${s.photo ? `<img class="quote-photo" src="${s.photo}" alt="">` : ''}
    ${s.kicker ? `<div class="kicker">${s.kicker}</div>` : ''}
    <div class="main${s.quote ? ' quote' : ''}">${s.main}</div>
    ${s.attrib ? `<div class="attrib">${s.attrib}</div>` : ''}
    ${s.image ? `<img class="shot" src="${s.image}" alt="${s.imageAlt || ''}">` : ''}
    ${s.sub ? `<div class="sub">${s.sub}</div>` : ''}
    ${s.link ? `<div class="vidlink">▶ <a href="${s.link}" target="_blank" rel="noopener">${s.linkText || 'watch on YouTube'}</a></div>` : ''}
  `;
  deck.appendChild(el);
  progress.style.width = ((i+1)/slides.length*100) + '%';
  counter.textContent = (i+1) + ' / ' + slides.length;
  acttag.textContent = s.act || '';
}

function next(){ if(i < slides.length-1){ i++; render(); } }
function prev(){ if(i > 0){ i--; render(); } }

document.addEventListener('keydown', (e)=>{
  if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){ e.preventDefault(); next(); }
  else if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){ e.preventDefault(); prev(); }
  else if(e.key === 'Home'){ i=0; render(); }
  else if(e.key === 'End'){ i=slides.length-1; render(); }
  else if(e.key.toLowerCase() === 'f'){
    if(!document.fullscreenElement) document.documentElement.requestFullscreen();
    else document.exitFullscreen();
  }
});

deck.addEventListener('click', (e)=>{
  const w = window.innerWidth;
  if(e.clientX < w/2) prev(); else next();
});

render();
</script>
